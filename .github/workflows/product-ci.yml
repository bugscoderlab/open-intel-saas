name: product-ci

# Open Intel product checks (ticket 10). Runs the platform scaffold checks:
# product unit/HTTP tests, architecture contracts, typecheck, and the
# Next.js shell build + feature-boundary lint. Upstream workflows are left
# untouched and are not part of product CI.

on:
  push:
    branches: [product/open-intel-v1]
  pull_request:
    branches: [product/open-intel-v1]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Managed-project connection for the managed tests (ticket #11+).
      # SUPABASE_SERVICE_ROLE_KEY is a repo secret. DATABASE_URL comes from
      # the SUPABASE_POOLER_URL secret: the direct host (db.<ref>) is
      # IPv6-only since Supabase's migration, and GitHub-hosted runners
      # have no IPv6 egress — the ap-south-1 session-mode pooler is the
      # IPv4 path. DATABASE_URL wins over SUPABASE_DB_HOST in Settings.
      SUPABASE_URL: https://blzyregwuiiplteehbtl.supabase.co
      SUPABASE_DB_HOST: db.blzyregwuiiplteehbtl.supabase.co
      DATABASE_URL: ${{ secrets.SUPABASE_POOLER_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      OPEN_INTEL_SEED_PASSWORD: seed-password-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install product dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pytest pytest-asyncio import-linter httpx mypy ruff sqlalchemy asyncpg "pyjwt[crypto]" python-dotenv
      - name: Ruff (product code)
        run: ruff check modules tests/product serve.py
      - name: Mypy (platform module + product tests)
        run: mypy modules/platform tests/product --ignore-missing-imports
      - name: Architecture contracts (import-linter)
        run: lint-imports
      - name: Product tests
        run: pytest tests/product -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shell dependencies
        run: npm ci
      - name: Feature-boundary lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Build-time public config (non-secret publishable key).
          NEXT_PUBLIC_SUPABASE_URL: https://blzyregwuiiplteehbtl.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:5055
